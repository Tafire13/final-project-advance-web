@if (!isRiderPage()) {

    <a routerLink="/customers" class="flex min-h-11 items-center gap-3 self-start rounded-lg text-inherit no-underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-700 focus-visible:ring-offset-2">
      <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-700 text-sm font-bold text-white" aria-hidden="true">ส</span>
      <span>
        <span class="block text-base font-semibold text-slate-900">ระบบจัดส่งอาหาร</span>

      </span>
    </a>

    <nav class="flex flex-wrap gap-2" aria-label="เมนูหลัก">
      <a routerLink="/customers" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">ลูกค้า</a>

    </nav>
  </div>
</header>
}

<div class="min-h-screen bg-slate-50">
