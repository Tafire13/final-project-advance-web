<div class="min-h-screen bg-slate-50 p-6 font-sans text-slate-800">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <div class="flex justify-between items-center border-b pb-4">
      <h1 class="text-xl font-bold">จัดการข้อมูลลูกค้า</h1>
      <span class="text-sm text-slate-500">ทั้งหมด {{ customers.length }} ราย</span>
    </div>

    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <h2 class="text-sm font-semibold mb-3">{{ isEdit ? 'แก้ไขข้อมูลลูกค้า' : 'เพิ่มลูกค้าใหม่' }}</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
        <div>
          <label class="block mb-1 text-slate-600">ชื่อ-นามสกุล</label>
          <input [(ngModel)]="form.name" class="w-full p-2 border rounded-md" placeholder="สมชาย ใจดี">
        </div>
        <div>
          <label class="block mb-1 text-slate-600">เบอร์โทรศัพท์</label>
          <input [(ngModel)]="form.phone" class="w-full p-2 border rounded-md" placeholder="0812345678">
        </div>
        <div>
          <label class="block mb-1 text-slate-600">ที่อยู่</label>
          <input [(ngModel)]="form.address" class="w-full p-2 border rounded-md" placeholder="บ้านเลขที่...">
        </div>
        <div>
          <label class="block mb-1 text-slate-600">Latitude</label>
          <input [(ngModel)]="form.latitude" class="w-full p-2 border rounded-md">
        </div>
        <div>
          <label class="block mb-1 text-slate-600">Longitude</label>
          <input [(ngModel)]="form.longitude" class="w-full p-2 border rounded-md">
        </div>
        <div class="flex items-end gap-2">
          <button (click)="onSubmit()" class="px-4 py-2 bg-slate-900 text-white rounded-md hover:bg-slate-800 text-xs font-medium">
            {{ isEdit ? 'อัปเดต' : 'บันทึก' }}
          </button>
          <button *ngIf="isEdit" (click)="resetForm()" class="px-3 py-2 bg-slate-200 text-slate-700 rounded-md text-xs">
            ยกเลิก
          </button>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl border overflow-hidden">
      <table class="w-full text-xs text-left">
        <thead class="bg-slate-100 text-slate-500 uppercase">
          <tr>
            <th class="p-3">ชื่อ</th>
            <th class="p-3">เบอร์โทร</th>
            <th class="p-3">ที่อยู่</th>
            <th class="p-3">พิกัดแผนที่</th>
            <th class="p-3 text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <tr *ngFor="let c of customers" class="hover:bg-slate-50">
            <td class="p-3 font-medium">{{ c.name }}</td>
            <td class="p-3">{{ c.phone }}</td>
            <td class="p-3">{{ c.address || '-' }}</td>
            <td class="p-3">
              <button (click)="openMapModal(c)" class="text-blue-600 hover:underline flex items-center gap-1">
                📍 {{ c.latitude }}, {{ c.longitude }}
              </button>
            </td>
            <td class="p-3 text-center space-x-2">
              <button (click)="onEdit(c)" class="text-amber-600 hover:underline">แก้ไข</button>
              <button (click)="onDelete(c.id)" class="text-rose-600 hover:underline">ลบ</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <div *ngIf="selectedCustomerForMap && mapUrl" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-4 w-full max-w-2xl space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-sm">ตำแหน่งบ้าน: {{ selectedCustomerForMap.name }}</h3>
        <button (click)="closeMapModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <div class="w-full h-80 bg-slate-100 rounded-lg overflow-hidden border">
        <iframe 
          width="100%" 
          height="100%" 
          frameborder="0" 
          scrolling="no" 
          marginheight="0" 
          marginwidth="0" 
          [src]="mapUrl">
        </iframe>
      </div>
      <div class="text-right">
        <button (click)="closeMapModal()" class="px-3 py-1.5 bg-slate-200 text-xs rounded-md">ปิด</button>
      </div>
    </div>
  </div>
</div>
